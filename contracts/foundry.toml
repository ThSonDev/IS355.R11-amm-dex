[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# scripts write deployments/<chainId>.addresses.json; tests write a throwaway copy under another chain id
fs_permissions = [{ access = "read-write", path = "../deployments" }]
